[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-musicvis-py5-2026-06"
version = "0.1.0"
description = "Toy music visualiser built with py5"
requires-python = ">=3.11"
dependencies = [
    "cffi<2",
    "py5",
    "sounddevice",
    "numpy",
]

[project.scripts]
toy-musicvis = "main:main"

[tool.setuptools]
py-modules = ["main", "music", "visuals"]
